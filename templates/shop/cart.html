{% extends 'base.html' %}{% block content %}<div class="page narrow"><h1>Mon panier</h1>{% for p,q,s in items %}<div class="row"><i class="fa-solid fa-{{p.icon}}"></i><div><b>{{p.name}}</b><small>Quantité : {{q}}</small></div><strong>{{s}} $</strong></div>{% empty %}<p>Votre panier est vide.</p>{% endfor %}{% if items %}<div class="total"><span>Total</span><b>{{total}} $</b></div><a class="btn wide" href="{% url 'checkout' %}">Procéder au paiement <i class="fa-solid fa-arrow-right"></i></a><a class="muted" href="{% url 'clear_cart' %}">Vider le panier</a>{% endif %}</div>{% endblock %}
